services:
  blogmvc:
    image: blogmvc
    build:
      context: .
      dockerfile: BlogMVC/Dockerfile
    ports:
      - "5125:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in a .env file or your shell environment}
      - Jwt__Issuer=${JWT_ISSUER:-BlogMVC}
      - Jwt__Audience=${JWT_AUDIENCE:-BlogMVC}
      - ConnectionStrings__DefaultConnection=DataSource=/app/data/app.db;Cache=Shared
    volumes:
      - sqlite_data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db:z
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  sqlite_data:

