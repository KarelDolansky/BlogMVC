name: Build and Test

on:
  push:
    branches:
      - 'master'
      - 'development'
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, debian]

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET Core sdk
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x 

      - name: Restore dependencies
        run: dotnet restore BlogMVC.sln

      - name: Run tests
        run: dotnet test BlogMVC.Tests/BlogMVC.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByFile="**/*Migrations/*.cs"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: KarelDolansky/BlogMVC
          file: BlogMVC.Tests/coverage.cobertura.xml